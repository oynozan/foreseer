<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Foreseer Verifier</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Akt:wght@300..800&family=Ubuntu:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="site">
    <span class="pill">runs entirely in your browser</span>
    <h1>Foreseer <span class="accent">receipt verifier</span></h1>
    <p>Every check runs locally with the open source @foreseer/sdk library.
        Nothing you paste leaves this page. <a href="index.html">About the protocol</a></p>
</header>
<main>
    <div class="card loader">
        <div class="grow"><label>Server URL (optional)</label><input id="server" placeholder="http://localhost:8787"></div>
        <div class="tiny"><label>Epoch</label><input id="epochId" value="1"></div>
        <div class="tiny"><label>Bet</label><input id="betId" value="0"></div>
        <button id="load" class="button alt">Load from server</button>
        <button id="example" class="button alt">Load golden example</button>
    </div>
    <div class="card">
        <div class="grid">
            <div>
                <label>Signed receipt JSON ({"receipt": ..., "signature": "0x..."})</label>
                <textarea id="receipt" style="min-height:180px"></textarea>
                <label>Rule JSON</label>
                <textarea id="rule"></textarea>
                <label>Merkle proof (JSON array of hex)</label>
                <textarea id="proof"></textarea>
            </div>
            <div>
                <label>Revealed server seed (hex)</label><input id="serverSeed">
                <label>Seed commitment (hex)</label><input id="seedCommit">
                <label>Merkle root (hex)</label><input id="merkleRoot">
                <label>Expected TEE address (from attestation registry)</label><input id="teeId">
                <label>Chain id</label><input id="chainId" value="114">
            </div>
        </div>
        <div class="actions">
            <button id="verify" class="button">Verify</button>
        </div>
    </div>
    <div id="results"><p>Paste a receipt or load the golden example.</p></div>
</main>
<footer>Foreseer, FORESEER-SPEC v0.1. MIT licensed.</footer>
<script src="foreseer-widget.js"></script>
</body>
</html>
